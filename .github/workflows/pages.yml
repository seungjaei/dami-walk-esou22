# main에 올리면 GitHub Pages로 자동 배포. 키는 저장소 Secrets(SUPABASE_URL, SUPABASE_ANON_KEY)에서 읽어 config.js를 만든다.
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: config.js 만들기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/make-config.mjs
      - name: 배포 파일 모으기 (+ 새 버전이 바로 보이도록 파일 주소에 버전 표시)
        run: |
          mkdir _site && cp -r index.html manifest.json js fonts icons _site/
          V=${GITHUB_SHA::7}
          sed -i -E "s#(src=\"js/[a-z]+\.js)\"#\1?v=$V\"#g; s#(href=\"(manifest\.json|icons/[a-z0-9-]+\.png))\"#\1?v=$V\"#g" _site/index.html
          grep -c "?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
