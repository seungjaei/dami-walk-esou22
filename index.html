<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2233">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>담이 산책 일기</title>
<link rel="icon" type="image/png" href="icons/dami-32.png">
<link rel="apple-touch-icon" href="icons/dami-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="담이워크">
<style>
@font-face{font-family:G11;src:url(fonts/Galmuri11.woff2) format("woff2")}
@font-face{font-family:G11B;src:url(fonts/Galmuri11-Bold.woff2) format("woff2")}
@font-face{font-family:G7;src:url(fonts/Galmuri7.woff2) format("woff2")}
@font-face{font-family:G9;src:url(fonts/Galmuri9.woff2) format("woff2")}
html,body{margin:0;height:100%;height:100dvh;background:#2b2233;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
.tb{position:fixed;display:none;align-items:center;justify-content:center;background:rgba(255,248,230,.22);border:3px solid rgba(255,248,230,.75);color:#fff;font:15px G11B;border-radius:50%;text-shadow:0 1px 0 #4a2e1e}
.sm{position:static;width:auto;min-width:46px;padding:0 9px;height:30px;border-radius:9px;font:12px G11B}
#topbar{position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:6px;z-index:3}
.tb.mn{border-radius:14px;font-size:22px}
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5}
#lform{background:#fbf0d6;border:4px solid #4a2e1e;box-shadow:0 0 0 4px #c98a4f,0 0 0 8px #4a2e1e;border-radius:6px;padding:18px 20px;width:min(300px,80vw);font:14px G11;color:#4a3426;display:flex;flex-direction:column;gap:9px}
#lform h1{margin:0 0 4px;font:20px G11B;color:#c0602a;text-align:center}
#lform input{font:16px G11;padding:9px 10px;border:3px solid #4a2e1e;border-radius:4px;background:#fffaf0;color:#4a3426;outline:none}
#lform input:focus{border-color:#c0602a}
#lform button{font:16px G11B;padding:10px;border:3px solid #4a2e1e;border-radius:4px;background:#f2a33a;color:#fff;text-shadow:0 1px 0 #8a4a2a;cursor:pointer}
#lform button:disabled{opacity:.6}
#lmsg{min-height:18px;font:12px G9;color:#d94f6a;text-align:center}
#lform .tabs{display:flex;gap:6px}
#lform .tabs button{flex:1;padding:7px;font:14px G11B;background:#e6d6b6;color:#7a5a3a;text-shadow:none}
#lform .tabs button.on{background:#c0602a;color:#fff}
#lform .up{display:none}
#lform.signup .up{display:block}
#lform .remember{display:flex;align-items:center;gap:6px;font:13px G9;color:#7a5a3a;cursor:pointer}
#lform .remember input{width:18px;height:18px;margin:0;accent-color:#c0602a}
#lform .lbl{font:12px G9;color:#7a5a3a}
#lform .lbl input{display:block;width:100%;box-sizing:border-box;margin-top:3px}
#lform input{box-sizing:border-box;width:100%}
#login{overflow-y:auto;padding:12px 0;box-sizing:border-box}
@media (max-height:480px){#login{align-items:flex-start}#lform{padding:10px 14px;gap:5px;margin:auto}#lform h1{font-size:16px;margin:0}#lform input{padding:6px 8px;font-size:15px}#lform button{padding:7px}}
#mp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;background:rgba(40,25,20,.55);padding:10px;box-sizing:border-box}
#mpbox{background:#fbf0d6;border:4px solid #4a2e1e;box-shadow:0 0 0 4px #c98a4f,0 0 0 8px #4a2e1e;border-radius:6px;width:min(640px,94vw);max-height:92vh;display:flex;flex-direction:column;font:14px G11;color:#4a3426}
#mpbox .mph{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:3px solid #e6d6b6}
#mpt{flex:1;font:17px G11B;color:#3d6a3a;text-align:center}
#mpbox .mph button{font:14px G11B;border:3px solid #4a2e1e;border-radius:4px;background:#e6d6b6;color:#7a5a3a;padding:3px 9px;cursor:pointer}
#mpbody{overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
#mpmsg{min-height:18px;padding:4px 10px 8px;font:12px G9;color:#d94f6a;text-align:center}#mpmsg.ok{color:#3d6a3a}
#mpbox h3{margin:4px 0 2px;font:14px G11B;color:#c0602a}
#mpbox .card{background:#fffaf0;border:3px solid #e6d6b6;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#mpbox .card.warn{border-color:#d94f6a}
#mpbox .code{font:20px G11B;letter-spacing:3px;color:#3d6a3a}
#mpbox .sub{font:12px G9;color:#9a7a5a}
#mpbox .row{display:flex;gap:8px;flex-wrap:wrap}#mpbox .row>button{flex:1}
#mpbox .item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px dashed #e6d6b6;font:13px G9}
#mpbox .act{display:flex;gap:4px;flex-shrink:0}
#mpbox button{font:14px G11B;padding:6px 10px;border:3px solid #4a2e1e;border-radius:4px;background:#e6d6b6;color:#7a5a3a;cursor:pointer}
#mpbox button.go{background:#6aae5a;color:#fff;text-shadow:0 1px 0 #2e5a28}#mpbox button.danger{background:#d94f6a;color:#fff}
#mpbox button.big{padding:9px;font-size:15px}#mpbox button:disabled{opacity:.55;cursor:default}
#mpbox .item button{font-size:12px;padding:3px 8px;border-width:2px}
#mpbox input{display:block;width:100%;box-sizing:border-box;margin-top:3px;font:16px G11;padding:7px 10px;border:3px solid #4a2e1e;border-radius:4px;background:#fffaf0;color:#4a3426;outline:none}
#mpbox .lbl{font:12px G9;color:#7a5a3a}
#mpbox .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#mpbox .slot{background:#fffaf0;border:3px solid #e6d6b6;border-radius:6px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;min-height:100px;justify-content:center}
#mpbox .slot.rd{border-color:#6aae5a;background:#eef8e8}#mpbox .slot.empty{border-style:dashed}
#mpbox .slot .nm{font:12px G11B}#mpbox .slot .st{font:11px G9;color:#3d6a3a}#mpbox .slot .sub{font-size:10px}
#mpbox canvas{image-rendering:pixelated;max-width:100%;background:transparent;position:static;width:auto;height:auto}
#mpbox .setup{display:flex;gap:10px;align-items:flex-start}#mpbox .pvbox{background:#e9f4e4;border-radius:6px;padding:4px;flex-shrink:0}
#mpbox .opts{display:flex;flex-direction:column;gap:4px;flex:1}
#mpbox .opt{display:flex;align-items:center;flex-wrap:wrap;gap:4px}#mpbox .ol{font:12px G9;color:#7a5a3a;width:42px}
#mpbox button.chip{min-width:26px;height:24px;padding:1px 6px;font:11px G9;border-width:2px}#mpbox button.chip.on{outline:3px solid #c0602a;outline-offset:1px;background-color:#ffe2b8}
#mpbox .breeds{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#mpbox button.breed{display:flex;flex-direction:column;align-items:center;padding:2px;font:10px G9;background:#fffaf0;border-width:2px}#mpbox button.breed.on{background:#ffe2b8;border-color:#c0602a}
@media (max-height:480px){#mpbox{max-height:96vh}#mpbody{padding:6px 10px;gap:6px}#mpbox .mph{padding:4px 8px}}
@media (max-width:560px){#mpbox .breeds{grid-template-columns:repeat(4,1fr)}#mpbox .setup{flex-direction:column}}
#upd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#2b2233;color:#fff7e0;font:18px G11B;text-align:center;z-index:20;padding:20px;box-sizing:border-box}
#upd small{font:13px G9;color:#d8c8b8;line-height:1.6}#upd .spin{width:34px;height:34px;border:5px solid #5a4a6a;border-top-color:#ffd23f;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#2b2233;color:#fff7e0;font:16px G11B;text-align:center;z-index:9}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1440" height="810"></canvas></div>
<div class="tb" data-k="A" style="right:calc(18px + env(safe-area-inset-right));bottom:70px;width:78px;height:78px">행동</div>
<div class="tb" data-k="B" style="right:calc(104px + env(safe-area-inset-right));bottom:22px;width:66px;height:66px">부르기</div>
<div id="topbar"><div class="tb sm" data-k="todo">할 일</div><div class="tb sm" data-k="map">지도</div><div class="tb sm" data-k="menu">메뉴</div><div class="tb sm" data-k="full" id="fullBtn">전체화면</div></div>
<div class="tb mn" data-k="up" style="left:calc(22px + env(safe-area-inset-left));bottom:104px;width:64px;height:64px">▲</div>
<div class="tb mn" data-k="down" style="left:calc(22px + env(safe-area-inset-left));bottom:28px;width:64px;height:64px">▼</div>
<div id="login"><form id="lform" autocomplete="on">
  <h1>🐶 담이 산책 일기</h1>
  <div class="tabs"><button type="button" id="tabIn" class="on">로그인</button><button type="button" id="tabUp">회원가입</button></div>
  <input id="lname" class="up" type="text" autocomplete="name" placeholder="이름" maxlength="20">
  <label class="up lbl">생년월일<input id="lbirth" type="date" min="1920-01-01"></label>
  <input id="lid" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="아이디 (영문·숫자 4~16자)" maxlength="16">
  <input id="lpw" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)">
  <input id="lpw2" class="up" type="password" autocomplete="new-password" placeholder="비밀번호 한 번 더">
  <label class="remember"><input id="lremember" type="checkbox" checked> 아이디 저장</label>
  <button id="lbtn" type="submit">로그인</button>
  <div id="lmsg"></div>
</form></div>
<div id="mp"><div id="mpbox"><div class="mph"><button id="mpback" type="button">◀</button><div id="mpt">👫 같이 하기</div><button id="mpx" type="button">✕</button></div><div id="mpbody"></div><div id="mpmsg"></div></div></div>
<div id="upd"><div class="spin"></div><div>🔧 업데이트 중입니다</div><small>지금까지 한 건 저장했어요.<br>새 버전이 준비되면 자동으로 첫 화면으로 돌아가요. 잠시만 기다려 주세요!</small></div>
<div id="rot">📱 휴대폰을 가로로 돌려 주세요<br><br>담이가 기다려요!</div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/lib.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/net.js"></script>
<script src="js/multi.js"></script>
<script src="js/ch1.js"></script>
<script src="js/ch1b.js"></script>
<script src="js/extra.js"></script>
<script src="js/glampmp.js"></script>
<script src="js/ui.js"></script>
<script src="js/ch2.js"></script>
<script src="js/hud2.js"></script>
<script src="js/care.js"></script>
<script src="js/town.js"></script>
<script src="js/buildings.js"></script>
<script src="js/update.js"></script>
</body>
</html>
