<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2233">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>담이 산책 일기</title>
<link rel="icon" type="image/png" href="icons/dami-32.png">
<link rel="apple-touch-icon" href="icons/dami-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="담이워크">
<style>
@font-face{font-family:G11;src:url(fonts/Galmuri11.woff2) format("woff2")}
@font-face{font-family:G11B;src:url(fonts/Galmuri11-Bold.woff2) format("woff2")}
@font-face{font-family:G7;src:url(fonts/Galmuri7.woff2) format("woff2")}
@font-face{font-family:G9;src:url(fonts/Galmuri9.woff2) format("woff2")}
html,body{margin:0;height:100%;height:100dvh;background:#2b2233;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
.tb{position:fixed;display:none;align-items:center;justify-content:center;background:rgba(255,248,230,.22);border:3px solid rgba(255,248,230,.75);color:#fff;font:15px G11B;border-radius:50%;text-shadow:0 1px 0 #4a2e1e}
.sm{position:static;width:auto;min-width:46px;padding:0 9px;height:30px;border-radius:9px;font:12px G11B}
#topbar{position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:6px;z-index:3}
.tb.mn{border-radius:14px;font-size:22px}
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5}
#lform{background:#fbf0d6;border:4px solid #4a2e1e;box-shadow:0 0 0 4px #c98a4f,0 0 0 8px #4a2e1e;border-radius:6px;padding:18px 20px;width:min(300px,80vw);font:14px G11;color:#4a3426;display:flex;flex-direction:column;gap:9px}
#lform h1{margin:0 0 4px;font:20px G11B;color:#c0602a;text-align:center}
#lform input{font:16px G11;padding:9px 10px;border:3px solid #4a2e1e;border-radius:4px;background:#fffaf0;color:#4a3426;outline:none}
#lform input:focus{border-color:#c0602a}
#lform button{font:16px G11B;padding:10px;border:3px solid #4a2e1e;border-radius:4px;background:#f2a33a;color:#fff;text-shadow:0 1px 0 #8a4a2a;cursor:pointer}
#lform button:disabled{opacity:.6}
#lmsg{min-height:18px;font:12px G9;color:#d94f6a;text-align:center}
#lform .tabs{display:flex;gap:6px}
#lform .tabs button{flex:1;padding:7px;font:14px G11B;background:#e6d6b6;color:#7a5a3a;text-shadow:none}
#lform .tabs button.on{background:#c0602a;color:#fff}
#lform .up{display:none}
#lform.signup .up{display:block}
#lform .remember{display:flex;align-items:center;gap:6px;font:13px G9;color:#7a5a3a;cursor:pointer}
#lform .remember input{width:18px;height:18px;margin:0;accent-color:#c0602a}
#lform .lbl{font:12px G9;color:#7a5a3a}
#lform .lbl input{display:block;width:100%;box-sizing:border-box;margin-top:3px}
#lform input{box-sizing:border-box;width:100%}
#login{overflow-y:auto;padding:12px 0;box-sizing:border-box}
@media (max-height:480px){#login{align-items:flex-start}#lform{padding:10px 14px;gap:5px;margin:auto}#lform h1{font-size:16px;margin:0}#lform input{padding:6px 8px;font-size:15px}#lform button{padding:7px}}
#room{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;overflow-y:auto;padding:12px 0;box-sizing:border-box}
#rform{background:#fbf0d6;border:4px solid #4a2e1e;box-shadow:0 0 0 4px #c98a4f,0 0 0 8px #4a2e1e;border-radius:6px;padding:16px 20px;width:min(300px,80vw);font:14px G11;color:#4a3426;display:flex;flex-direction:column;gap:8px;margin:auto}
#rform h1{margin:0 0 2px;font:18px G11B;color:#3d6a3a;text-align:center}
#rform .lbl{font:12px G9;color:#7a5a3a}
#rform input{display:block;width:100%;box-sizing:border-box;margin-top:3px;font:16px G11;padding:8px 10px;border:3px solid #4a2e1e;border-radius:4px;background:#fffaf0;color:#4a3426;outline:none}
#rform input[readonly]{background:#e9f4e4;letter-spacing:3px;font-family:G11B}
#rform button{font:16px G11B;padding:9px;border:3px solid #4a2e1e;border-radius:4px;background:#6aae5a;color:#fff;text-shadow:0 1px 0 #2e5a28;cursor:pointer}
#rform button.sub{background:#e6d6b6;color:#7a5a3a;text-shadow:none;font-size:14px;padding:6px}
#rlist{display:flex;flex-wrap:wrap;gap:5px}#rform button.chip{font:12px G9;padding:4px 8px;background:#e9f4e4;color:#3d6a3a;text-shadow:none;border-width:2px}
@media (max-height:480px){#room{align-items:flex-start}#rform{padding:8px 14px;gap:4px}#rform h1{font-size:15px}#rform input{padding:5px 8px;font-size:15px}#rform button{padding:5px;font-size:14px}}
#rform .rm{min-height:16px;font:12px G9;color:#3d6a3a;text-align:center}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#2b2233;color:#fff7e0;font:16px G11B;text-align:center;z-index:9}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1440" height="810"></canvas></div>
<div class="tb" data-k="A" style="right:calc(18px + env(safe-area-inset-right));bottom:70px;width:78px;height:78px">행동</div>
<div class="tb" data-k="B" style="right:calc(104px + env(safe-area-inset-right));bottom:22px;width:66px;height:66px">부르기</div>
<div id="topbar"><div class="tb sm" data-k="todo">할 일</div><div class="tb sm" data-k="map">지도</div><div class="tb sm" data-k="menu">메뉴</div><div class="tb sm" data-k="full" id="fullBtn">전체화면</div></div>
<div class="tb mn" data-k="up" style="left:calc(22px + env(safe-area-inset-left));bottom:104px;width:64px;height:64px">▲</div>
<div class="tb mn" data-k="down" style="left:calc(22px + env(safe-area-inset-left));bottom:28px;width:64px;height:64px">▼</div>
<div id="login"><form id="lform" autocomplete="on">
  <h1>🐶 담이 산책 일기</h1>
  <div class="tabs"><button type="button" id="tabIn" class="on">로그인</button><button type="button" id="tabUp">회원가입</button></div>
  <input id="lname" class="up" type="text" autocomplete="name" placeholder="이름" maxlength="20">
  <label class="up lbl">생년월일<input id="lbirth" type="date" min="1920-01-01"></label>
  <input id="lid" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="아이디 (영문·숫자 4~16자)" maxlength="16">
  <input id="lpw" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)">
  <input id="lpw2" class="up" type="password" autocomplete="new-password" placeholder="비밀번호 한 번 더">
  <label class="remember"><input id="lremember" type="checkbox" checked> 아이디 저장</label>
  <button id="lbtn" type="submit">로그인</button>
  <div id="lmsg"></div>
</form></div>
<div id="room"><form id="rform" autocomplete="off">
  <h1 id="rtitle">👫 같이 하기 (최대 4명)</h1>
  <label class="lbl">내 별명 (친구에게 보여요 · 8자)<input id="rnick" type="text" maxlength="8" placeholder="예: 담이언니"></label>
  <label class="lbl">방 코드 (숫자 6자리)<input id="rcode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456"></label>
  <div id="rlist"></div>
  <button id="rnew" type="button" class="sub">새 코드 받기</button>
  <button id="rbtn" type="submit">친구방 들어가기</button>
  <button id="rcancel" type="button" class="sub">취소</button>
  <div id="rmsg" class="rm"></div>
</form></div>
<div id="rot">📱 휴대폰을 가로로 돌려 주세요<br><br>담이가 기다려요!</div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/lib.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
